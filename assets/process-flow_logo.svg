<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 128" width="600" height="128"
     role="img" aria-label="process-flow: Nextflow channel viewer">
  <title>process-flow</title>

  <!-- route-line mark, after rnaseq-flow's: one channel (the dark trunk)
       branches at a station into four metro lines, ending as rnaseq-flow's do -->
  <g fill="none" stroke-width="9.5" stroke-linecap="round">
    <path d="M48,64 C74,64 68,36 96,36 L124,36" stroke="#c2255c"/>
    <path d="M48,64 C68,64 68,55 88,55 L154,55" stroke="#1c7ed6"/>
    <path d="M48,64 C68,64 68,74 88,74 L108,74" stroke="#7048e8"/>
    <path d="M48,64 C74,64 68,93 96,93 L138,93" stroke="#f08c00"/>
    <path d="M20,64 L48,64" stroke="#1f4e79"/>
  </g>
  <circle cx="48" cy="64" r="9" fill="#ffffff" stroke="#1f4e79" stroke-width="4"/>
  <circle cx="154" cy="55" r="7.6" fill="#ffffff" stroke="#1c7ed6" stroke-width="3.6"/>
  <circle cx="138" cy="93" r="7.6" fill="#ffffff" stroke="#f08c00" stroke-width="3.6"/>

  <!-- wordmark -->
  <text x="186" y="74" font-family="'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="56" font-weight="800">
    <tspan fill="#1f4e79">process</tspan><tspan fill="#2e75b6">-flow</tspan>
  </text>

  <!-- tagline -->
  <text x="189" y="103" font-family="'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="14.5" font-weight="600" letter-spacing="3" fill="#64748b">NEXTFLOW CHANNEL VIEWER</text>
</svg>
